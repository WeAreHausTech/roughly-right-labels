<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#f4f1ea"/>
  <g transform="translate(120,150) scale(1.25)">
    <rect x="4" y="4" width="120" height="120" rx="26" fill="#1a7f4b"/>
    <text x="56" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="88" fill="#fff" text-anchor="middle">R</text>
    <path d="M82 74 l10 10 l20 -26" fill="none" stroke="#ffd84a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="320" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="76" fill="#1d1d1b">Roughly Righter</text>
  <text x="322" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#55524b">Roughly Right, med ditt teams egna ord.</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34">
    <rect x="120" y="400" width="1040" height="96" rx="16" fill="#fff"/>
    <text x="160" y="460" fill="#9a958a">Tid är pengar</text>
    <text x="440" y="460" fill="#1a7f4b" font-weight="700">→</text>
    <text x="510" y="460" fill="#1d1d1b">Ekonomi, eller vad ni vill kalla det</text>
    <rect x="120" y="520" width="1040" height="96" rx="16" fill="#fff"/>
    <text x="160" y="580" fill="#9a958a">12,5 h kvar</text>
    <text x="440" y="580" fill="#1a7f4b" font-weight="700">→</text>
    <text x="510" y="580" fill="#1d1d1b">Fördela över månader, jämnt eller i kurva</text>
  </g>
  <text x="120" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#9a958a">Inofficiellt tillägg. Inte kopplat till Roughly Right.</text>
</svg>
