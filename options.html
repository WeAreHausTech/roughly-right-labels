<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Roughly Righter</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
  textarea { width: 100%; height: 320px; font: 13px ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 6px 16px; }
  #status { margin-left: 8px; color: #1a7f4b; }
  code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>Roughly Righter</h1>
  <p>En regel per rad: <code>Gammal text =&gt; Ny text</code>. Texten måste matcha exakt (stor/liten bokstav spelar roll).</p>
  <textarea id="rules" spellcheck="false"></textarea>
  <div><button id="save">Spara</button><span id="status"></span></div>
  <p>Ändringar slår igenom direkt. Att ta bort en regel kräver omladdning av appen (Cmd+R).</p>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
